[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "stage6c"
version = "0.1.0"
description = "Stage-6C Agent-Loop mutation harness (M2 skeleton)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
yaml = ["pyyaml"]

[project.scripts]
stage6c-smoke-run = "stage6.stage6c.cli.main:main"
stage6c-report = "stage6.stage6c.reporting.cli:main"
stage6c-run-suite = "stage6.stage6c.orchestrator.cli:main"
stage6c-freeze = "stage6.stage6c.freeze.cli:main"

[tool.setuptools.packages.find]
where = [".."]
include = ["stage6"]
