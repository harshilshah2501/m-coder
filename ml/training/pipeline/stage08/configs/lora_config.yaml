# LoRA + Trainer config. model_name_or_path is set in train.py to SCRIPT_DIR/base_model.
model_name_or_path: "."

# Phase-08C: single dataset file (optional; if set, only this file is loaded from dataset dir).
dataset_file: "golden_exemplars_v1_frozen.jsonl"
# Balanced base split: val = 1 REF, 2 CONF, 1 DES base; train = remaining + ALL MIX + ALL CODE (deterministic).
balanced_val_split: true
# Disable early stop; rely on invariance audit instead.
disable_early_stop: true

lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
bias: "none"
task_type: "CAUSAL_LM"

num_train_epochs: 2
per_device_train_batch_size: 4
per_device_eval_batch_size: 4
learning_rate: 3.0e-5
warmup_ratio: 0.05
weight_decay: 0.0
max_grad_norm: 1.0
lr_scheduler_type: "cosine"

evaluation_strategy: "steps"
save_strategy: "steps"
logging_steps: 10
load_best_model_at_end: true
