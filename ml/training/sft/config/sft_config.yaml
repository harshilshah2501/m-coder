# SFT Training Configuration Template

## Model Configuration
base_model: "./models/motadata-cpt-final-locked"
model_type: "causal_lm"
quantization: "bfloat16"

## LoRA Configuration
lora_config:
  r: 16
  lora_alpha: 32
  target_modules: ["q_proj", "v_proj"]
  lora_dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

## Training Configuration
training_args:
  output_dir: "./models/sft"
  num_train_epochs: 3
  per_device_train_batch_size: 4
  per_device_eval_batch_size: 4
  gradient_accumulation_steps: 2
  learning_rate: 2e-4
  warmup_steps: 100
  max_steps: 3000
  save_strategy: "steps"
  save_steps: 500
  eval_strategy: "steps"
  eval_steps: 500
  logging_steps: 50
  seed: 42
  
## Dataset Configuration
dataset:
  type: "instruction_response"
  train_file: "./ml/datasets/sft/processed/train.jsonl"
  validation_file: "./ml/datasets/sft/processed/validation.jsonl"
  max_length: 512
  
## Description
- Training on instruction-response pairs
- Building on top of CPT domain knowledge
- Adds instruction-following capability
- Maintains Motadata-specific patterns from CPT
