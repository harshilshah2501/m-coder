[build-system]
requires = ["setuptools>=61", "setuptools-scm[toml]>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcoder-suite"
dynamic = ["version"]
description = "Unified m-coder developer package (mcoder CLI + Context Layer service)"
readme = "README.md"
requires-python = ">=3.10"
license = "LicenseRef-Motadata-Proprietary"
dependencies = [
    "PyYAML>=6.0",
]

[tool.setuptools]
license-files = ["LICENSE*"]

[project.scripts]
mcoder = "runtime.mcoder_cli.cli:main"
motadata-context-layer = "runtime.context_layer_service.cli:main"

[tool.setuptools.packages.find]
where = ["../.."]
include = ["runtime.layer5*", "runtime.context_layer_service*", "runtime.mcoder_cli*"]
exclude = [
    "runtime.layer5.tests*",
    "runtime.layer5.evidence.golden*",
    "runtime.layer5.evidence.golden.*",
    "runtime.layer5.evidence.golden.fixture_workspace*",
    "runtime.layer5.evidence.golden.fixture_workspace.module",
    "runtime.layer5.evidence.samples*",
]

[tool.setuptools.package-data]
"runtime.layer5.evidence" = ["evidence_bundle.v1.schema.json", "evidence_bundle.v1.md"]
"runtime.layer5.retrieval" = ["domain_priors.yaml"]
"runtime.layer5.authority" = ["product_authority_registry.yaml"]

[tool.setuptools_scm]
fallback_version = "0.1.1.dev0"
version_scheme = "no-guess-dev"
local_scheme = "node-and-date"
root = "../.."
tag_regex = "^(?:v)?(?P<version>\\d+\\.\\d+\\.\\d+(?:[.-].*)?)$"
git_describe_command = "git describe --dirty --tags --long --match 'v[0-9]*' --match '[0-9]*'"
