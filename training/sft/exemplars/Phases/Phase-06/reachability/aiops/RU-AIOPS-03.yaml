ReachabilityUnit:
  id: RU-AIOPS-03
  execution_surface:
    ref: AI-SURF-03
    system: AIOps
    plane: hybrid
    description: Transition from recommendation output to user-approved execution

  action_transition:
    from_state: advisory
    to_state: execution
    trigger: approval event

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: recommendation generated → approval received → action executed
    fallback_paths:
      - API-based auto-approval
    retry_paths:
      - delayed execution after approval
    failure_paths:
      - approval event replay
      - execution worker restart
      - approval context loss

  guard_enforcement_points:
    pre_action: approval-to-execution boundary
    mid_action: execution initiation
    post_action: approval fulfillment logging

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
