ReachabilityUnit:
  id: RU-AIOPS-04
  execution_surface:
    ref: AI-SURF-04
    system: AIOps
    plane: control
    description: Configuration persistence and downstream propagation mechanisms

  action_transition:
    from_state: config-ready
    to_state: persistence
    trigger: configuration write or update request

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-03
    - CODE-04
    - CODE-06
    - CODE-07

  control_paths:
    primary_path: config change requested → persisted → propagated
    fallback_paths:
      - default config application
    retry_paths:
      - propagation retry after partial success
    failure_paths:
      - partial tenant propagation
      - persistence failure
      - stale configuration overwrite

  guard_enforcement_points:
    pre_action: config validation and write gate
    mid_action: propagation orchestration
    post_action: propagation completion tracking

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
