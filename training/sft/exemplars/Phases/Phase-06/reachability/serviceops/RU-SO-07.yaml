reachability_unit:
  id: RU-SO-07
  execution_surface:
    ref: SO-SURF-07
    system: ServiceOps
    plane: control
    description: Automated creation, linking, acceptance, or closure of problems

  action_transition:
    from_state: problem-evaluated
    to_state: execution
    trigger: problem lifecycle rule or analytics signal

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: analytics signal → problem action executed
    fallback_paths:
      - inferred problem linkage
    retry_paths:
      - lifecycle rule re-evaluation
    failure_paths:
      - partial problem linkage
      - incorrect closure
      - replayed lifecycle event

  guard_enforcement_points:
    pre_action: problem lifecycle admission gate
    mid_action: lifecycle execution
    post_action: problem state reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Problem lifecycle actions may legitimize incorrect root cause assumptions
