reachability_unit:
  id: RU-SO-09
  execution_surface:
    ref: SO-SURF-09
    system: ServiceOps
    plane: control
    description: Scheduled or delayed execution of ServiceOps actions

  action_transition:
    from_state: persisted-intent
    to_state: execution
    trigger: schedule or deferred trigger

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: intent stored → scheduled execution triggered
    fallback_paths:
      - manual reschedule or override
    retry_paths:
      - deferred execution retry
    failure_paths:
      - scheduler restart
      - stale intent execution
      - duplicate trigger

  guard_enforcement_points:
    pre_action: deferred execution admission gate
    mid_action: scheduled execution start
    post_action: execution reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Time separation invalidates assumptions present at intent creation
