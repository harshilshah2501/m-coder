reachability_unit:
  id: RU-SO-12
  execution_surface:
    ref: SO-SURF-12
    system: ServiceOps
    plane: control
    description: Actions triggered during system startup, import, or recovery

  action_transition:
    from_state: restored-state
    to_state: execution
    trigger: system recovery or bootstrap

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: system restart → queued action executed
    fallback_paths:
      - partial state restoration
    retry_paths:
      - replay of incomplete actions
    failure_paths:
      - corrupted persisted intent
      - duplicate execution
      - missing historical context

  guard_enforcement_points:
    pre_action: recovery admission gate
    mid_action: bootstrap execution
    post_action: recovery checkpoint

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Recovery paths often assume validation already occurred in prior runtime
