reachability_unit:
  id: RU-SO-08
  execution_surface:
    ref: SO-SURF-08
    system: ServiceOps
    plane: control
    description: Automated publication, update, or retirement of knowledge articles

  action_transition:
    from_state: knowledge-evaluated
    to_state: persistence
    trigger: knowledge workflow or confidence threshold

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-03
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: article confidence met → publish or retire executed
    fallback_paths:
      - default publication workflow
    retry_paths:
      - publication retry on failure
    failure_paths:
      - partial article update
      - stale content publication
      - incorrect auto-retirement

  guard_enforcement_points:
    pre_action: knowledge publish admission gate
    mid_action: publication workflow
    post_action: knowledge state finalization

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Published knowledge may indirectly authorize unsafe future actions
