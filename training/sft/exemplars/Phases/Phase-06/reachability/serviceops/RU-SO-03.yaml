reachability_unit:
  id: RU-SO-03
  execution_surface:
    ref: SO-SURF-03
    system: ServiceOps
    plane: control
    description: Automated logic that resolves, closes, suppresses, or downgrades incidents

  action_transition:
    from_state: incident-evaluated
    to_state: execution
    trigger: auto-resolution condition met

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: incident condition met → auto-resolution executed
    fallback_paths:
      - inferred correlation-based resolution
    retry_paths:
      - re-attempt resolution after failure
    failure_paths:
      - incident state replay
      - partial closure
      - suppression without resolution

  guard_enforcement_points:
    pre_action: auto-resolution admission gate
    mid_action: resolution execution
    post_action: incident state reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Automated incident actions may suppress future signal visibility
