validation_ledger_entry:
  entry_id: VL-SO-04-CODE-08

  reachability_unit_id: RU-SO-04

  execution_surface:
    system: ServiceOps
    surface_name: Service Request Fulfillment Automation

  code_guard: CODE-08

  enforcement_points:
    pre_action: present
    mid_action: absent
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: uncovered
    retry_paths: uncovered
    failure_paths: uncovered

  enforcement_mechanism:
    type: implicit
    location: request context loader

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: no-op

  evidence:
    artifact_type: code
    reference: request-context-staleness-check

  notes: >
    Context freshness for approved service requests is evaluated when
    fulfillment workflows start; fallback, retry, and failure handling
    reuse existing context without re-validation

