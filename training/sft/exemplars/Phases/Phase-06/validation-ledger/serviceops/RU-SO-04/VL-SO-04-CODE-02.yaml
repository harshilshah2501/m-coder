validation_ledger_entry:
  entry_id: VL-SO-04-CODE-02

  reachability_unit_id: RU-SO-04

  execution_surface:
    system: ServiceOps
    surface_name: Service Request Fulfillment Automation

  code_guard: CODE-02

  enforcement_points:
    pre_action: present
    mid_action: absent
    post_action: present

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: uncovered
    failure_paths: covered

  enforcement_mechanism:
    type: hard-gate
    location: request-ownership validator

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: code
    reference: request-ownership-check-module

  notes: >
    Ownership legitimacy is evaluated when fulfillment workflows are
    admitted and when completion handlers reconcile request state;
    retries do not re-validate ownership context

