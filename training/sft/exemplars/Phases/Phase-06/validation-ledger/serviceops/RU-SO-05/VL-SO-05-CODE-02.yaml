    mid_action: absent
    post_action: present

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: uncovered
    failure_paths: covered

  enforcement_mechanism:
    type: hard-gate
    location: CMDB ownership validator

  terminal_behavior:
