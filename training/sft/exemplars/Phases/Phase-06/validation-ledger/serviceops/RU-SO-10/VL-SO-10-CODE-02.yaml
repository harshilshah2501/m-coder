validation_ledger_entry:
  entry_id: VL-SO-10-CODE-02

  reachability_unit_id: RU-SO-10

  execution_surface:
    system: ServiceOps
    surface_name: Retry, Replay & Reconciliation Jobs

  code_guard: CODE-02

  enforcement_points:
    pre_action: present
    mid_action: absent
    post_action: present

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: uncovered
    failure_paths: covered

  enforcement_mechanism:
    type: hard-gate
    location: retry ownership validator

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: code
    reference: retry-ownership-check-module

  notes: >
    Ownership legitimacy for retried or replayed actions is evaluated
    when jobs are admitted and when reconciliation completes; repeated
    replay attempts do not re-validate ownership context

