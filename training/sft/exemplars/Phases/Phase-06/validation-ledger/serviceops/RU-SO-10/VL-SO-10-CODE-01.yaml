validation_ledger_entry:
  entry_id: VL-SO-10-CODE-01

  reachability_unit_id: RU-SO-10

  execution_surface:
    system: ServiceOps
    surface_name: Retry, Replay & Reconciliation Jobs

  code_guard: CODE-01

  enforcement_points:
    pre_action: present
    mid_action: present
    post_action: present

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: covered

  enforcement_mechanism:
    type: hard-gate
    location: retry admission gate

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: refusal

  evidence:
    artifact_type: workflow
    reference: retry-and-replay-admission-gate

  notes: >
    CODE-01 enforcement evaluated when failed or partial actions are
    admitted to retry, replay, or reconciliation jobs across all
    configured paths

