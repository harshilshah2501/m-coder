validation_ledger_entry:
  entry_id: VL-AIOPS-07-CODE-04

  reachability_unit_id: RU-AIOPS-07

  execution_surface:
    system: AIOps
    surface_name: Cross-Service / Cross-Domain Correlation Actions

  code_guard: CODE-04

  enforcement_points:
    pre_action: present
    mid_action: conditional
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: uncovered

  enforcement_mechanism:
    type: hard-gate
    location: cross-domain approval policy engine

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: config
    reference: cross-domain-approval-policies

  notes: >
    Approval scope and irreversibility for cross-service or
    cross-domain correlated actions is enforced when bridging
    correlation resolution into execution on primary, fallback, and
    retry paths; failure paths may not re-evaluate approval
