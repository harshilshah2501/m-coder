ValidationLedgerEntry:
  entry_id: VL-AIOPS-04-CODE-04

  reachability_unit_id: RU-AIOPS-04

  execution_surface:
    system: AIOps
    surface_name: Configuration Write & Propagation Plane

  code_guard: CODE-04

  enforcement_points:
    pre_action: present
    mid_action: conditional
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: uncovered

  enforcement_mechanism:
    type: hard-gate
    location: configuration approval policy engine

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: config
    reference: configuration-approval-policies

  notes: >
    Approval scope and irreversibility for configuration changes is
    enforced when bridging from config-ready to persistence on
    primary, fallback, and retry paths; failure paths may not
    re-evaluate approval

