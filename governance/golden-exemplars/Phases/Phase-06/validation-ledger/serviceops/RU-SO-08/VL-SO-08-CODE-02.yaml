ValidationLedgerEntry:
  entry_id: VL-SO-08-CODE-02

  reachability_unit_id: RU-SO-08

  execution_surface:
    system: ServiceOps
    surface_name: Knowledge Article Auto-Publish / Auto-Retire

  code_guard: CODE-02

  enforcement_points:
    pre_action: present
    mid_action: absent
    post_action: present

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: uncovered
    failure_paths: covered

  enforcement_mechanism:
    type: hard-gate
    location: knowledge ownership validator

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: code
    reference: knowledge-ownership-check-module

  notes: >
    Ownership legitimacy for knowledge articles and their associated
    services is evaluated when automated publication or retirement is
    admitted and when state finalization completes; retry attempts do
    not re-validate ownership context

