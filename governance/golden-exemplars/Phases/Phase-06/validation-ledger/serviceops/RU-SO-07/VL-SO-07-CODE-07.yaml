ValidationLedgerEntry:
  entry_id: VL-SO-07-CODE-07

  reachability_unit_id: RU-SO-07

  execution_surface:
    system: ServiceOps
    surface_name: Problem Management Lifecycle Automation

  code_guard: CODE-07

  enforcement_points:
    pre_action: present
    mid_action: present
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: uncovered

  enforcement_mechanism:
    type: hard-gate
    location: problem impact assessor

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: spec
    reference: problem-impact-model

  notes: >
    Blast radius for automated problem lifecycle actions is computed
    and enforced before and during execution on primary, fallback,
    and retry paths; failure handling is recorded but may not
    recompute impact

