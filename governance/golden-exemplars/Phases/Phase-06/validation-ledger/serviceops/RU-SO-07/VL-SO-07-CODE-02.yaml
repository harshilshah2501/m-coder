ValidationLedgerEntry:
  entry_id: VL-SO-07-CODE-02

  reachability_unit_id: RU-SO-07

  execution_surface:
    system: ServiceOps
    surface_name: Problem Management Lifecycle Automation

  code_guard: CODE-02

  enforcement_points:
    pre_action: present
    mid_action: absent
    post_action: present

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: uncovered
    failure_paths: covered

  enforcement_mechanism:
    type: hard-gate
    location: problem ownership validator

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: code
    reference: problem-ownership-check-module

  notes: >
    Ownership legitimacy for problems and their linked entities is
    evaluated when lifecycle automation is admitted and when problem
    state reconciliation completes; retry evaluations do not
    re-validate ownership context

