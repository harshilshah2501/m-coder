ValidationLedgerEntry:
  entry_id: VL-SO-02-CODE-07

  reachability_unit_id: RU-SO-02

  execution_surface:
    system: ServiceOps
    surface_name: Change Management Approval → Execution Bridge

  code_guard: CODE-07

  enforcement_points:
    pre_action: present
    mid_action: present
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: uncovered

  enforcement_mechanism:
    type: hard-gate
    location: change impact assessor

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: spec
    reference: change-impact-model

  notes: >
    Blast radius is computed and enforced before and during approved
    change execution; failure recovery paths can modify scope without
    re-evaluating impact

