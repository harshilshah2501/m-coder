ValidationLedgerEntry:
  entry_id: VL-SO-02-CODE-04

  reachability_unit_id: RU-SO-02

  execution_surface:
    system: ServiceOps
    surface_name: Change Management Approval → Execution Bridge

  code_guard: CODE-04

  enforcement_points:
    pre_action: present
    mid_action: conditional
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: uncovered

  enforcement_mechanism:
    type: hard-gate
    location: change-approval policy engine

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: config
    reference: change-approval-policies

  notes: >
    Approval scope and irreversibility are enforced at the bridge
    boundary; failure recovery paths do not re-evaluate approval

