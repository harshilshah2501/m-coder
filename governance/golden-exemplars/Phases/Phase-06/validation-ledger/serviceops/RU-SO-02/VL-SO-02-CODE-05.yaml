ValidationLedgerEntry:
  entry_id: VL-SO-02-CODE-05

  reachability_unit_id: RU-SO-02

  execution_surface:
    system: ServiceOps
    surface_name: Change Management Approval → Execution Bridge

  code_guard: CODE-05

  enforcement_points:
    pre_action: present
    mid_action: conditional
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: uncovered

  enforcement_mechanism:
    type: soft-gate
    location: change approval resolver

  terminal_behavior:
    on_guard_trigger: audit-only
    on_guard_failure: no-op

  evidence:
    artifact_type: config
    reference: change-approval-workflow-rules

  notes: >
    Human-in-the-loop confirmation is enforced when bridging approval
    to execution on primary and fallback paths; failure recovery flows
    bypass this confirmation

