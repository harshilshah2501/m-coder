ValidationLedgerEntry:
  entry_id: VL-SO-03-CODE-07

  reachability_unit_id: RU-SO-03

  execution_surface:
    system: ServiceOps
    surface_name: Incident Auto-Resolution & Closure Logic

  code_guard: CODE-07

  enforcement_points:
    pre_action: present
    mid_action: present
    post_action: absent

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: covered
    failure_paths: uncovered

  enforcement_mechanism:
    type: hard-gate
    location: incident impact assessor

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: spec
    reference: incident-impact-model

  notes: >
    Blast radius for incident auto-resolution is computed and enforced
    before and during execution on primary, fallback, and retry paths;
    failure handling is recorded but may not recompute impact

