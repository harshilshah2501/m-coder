ValidationLedgerEntry:
  entry_id: VL-SO-12-CODE-02

  reachability_unit_id: RU-SO-12

  execution_surface:
    system: ServiceOps
    surface_name: System Recovery, Import & Bootstrap Paths

  code_guard: CODE-02

  enforcement_points:
    pre_action: present
    mid_action: absent
    post_action: present

  coverage_paths:
    primary_path: covered
    fallback_paths: covered
    retry_paths: uncovered
    failure_paths: covered

  enforcement_mechanism:
    type: hard-gate
    location: recovery ownership and scope validator

  terminal_behavior:
    on_guard_trigger: refusal
    on_guard_failure: audit-only

  evidence:
    artifact_type: code
    reference: recovery-ownership-check-module

  notes: >
    Ownership legitimacy and scope for actions triggered during
    recovery or import is evaluated when recovered intents are
    admitted and when reconciliation completes; replay of incomplete
    actions does not re-validate ownership context

