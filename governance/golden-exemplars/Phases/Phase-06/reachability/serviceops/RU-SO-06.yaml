reachability_unit:
  id: RU-SO-06
  execution_surface:
    ref: SO-SURF-06
    system: ServiceOps
    plane: control
    description: Automated actions triggered by SLA or SLO breach detection

  action_transition:
    from_state: sla-evaluated
    to_state: execution
    trigger: SLA or SLO breach condition met

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: breach detected → escalation or workflow action executed
    fallback_paths:
      - inferred breach under missing metrics
    retry_paths:
      - repeated breach evaluation
    failure_paths:
      - metric ingestion delay
      - duplicate escalation
      - breach replay after recovery

  guard_enforcement_points:
    pre_action: breach-to-action gate
    mid_action: escalation execution
    post_action: breach handling reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Breach automation may amplify pressure and override contextual judgment
