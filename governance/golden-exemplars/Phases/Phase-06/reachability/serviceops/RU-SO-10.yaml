reachability_unit:
  id: RU-SO-10
  execution_surface:
    ref: SO-SURF-10
    system: ServiceOps
    plane: control
    description: Background jobs that retry, replay, or reconcile ITSM actions

  action_transition:
    from_state: failed-or-partial
    to_state: execution
    trigger: retry or replay job

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: failure detected → retry job executed
    fallback_paths:
      - reconciliation after partial success
    retry_paths:
      - repeated replay attempts
    failure_paths:
      - retry storms
      - duplicated side effects
      - inconsistent reconciliation

  guard_enforcement_points:
    pre_action: retry admission gate
    mid_action: replay execution
    post_action: reconciliation checkpoint

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Replay paths often assume original legitimacy and freshness
