reachability_unit:
  id: RU-SO-01
  execution_surface:
    ref: SO-SURF-01
    system: ServiceOps
    plane: control
    description: ITSM workflow rules that automatically transition, assign, escalate, or resolve records

  action_transition:
    from_state: workflow-evaluated
    to_state: execution
    trigger: workflow rule match

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: record update → workflow rule fires → action executed
    fallback_paths:
      - default workflow resolution
    retry_paths:
      - workflow re-evaluation on subsequent updates
    failure_paths:
      - workflow engine restart
      - partial rule execution
      - duplicate transition

  guard_enforcement_points:
    pre_action: workflow admission gate
    mid_action: rule execution step
    post_action: workflow completion handler

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Workflow rules may cascade across multiple entities in a single evaluation cycle
