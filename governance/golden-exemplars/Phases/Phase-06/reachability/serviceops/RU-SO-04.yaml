reachability_unit:
  id: RU-SO-04
  execution_surface:
    ref: SO-SURF-04
    system: ServiceOps
    plane: control
    description: Automated provisioning or fulfillment actions for approved service requests

  action_transition:
    from_state: request-approved
    to_state: execution
    trigger: fulfillment workflow start

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-04
    - CODE-05
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: request approved → fulfillment executed
    fallback_paths:
      - template-based fulfillment
    retry_paths:
      - fulfillment retry on failure
    failure_paths:
      - partial provisioning
      - external system timeout
      - duplicate fulfillment

  guard_enforcement_points:
    pre_action: fulfillment admission gate
    mid_action: provisioning workflow
    post_action: fulfillment completion handler

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Fulfillment may involve external systems with independent failure semantics
