reachability_unit:
  id: RU-SO-11
  execution_surface:
    ref: SO-SURF-11
    system: ServiceOps
    plane: control
    description: APIs or integrations capable of executing ServiceOps actions

  action_transition:
    from_state: external-request
    to_state: execution
    trigger: API call or integration event

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: API request received → action executed
    fallback_paths:
      - legacy or compatibility endpoint
    retry_paths:
      - client retries
      - webhook replays
    failure_paths:
      - partial authorization context
      - duplicate execution
      - integration timeout

  guard_enforcement_points:
    pre_action: API admission and validation
    mid_action: execution dispatch
    post_action: request reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    Integration paths may bypass UI-level safeguards
