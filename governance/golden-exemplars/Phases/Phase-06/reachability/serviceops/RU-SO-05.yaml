reachability_unit:
  id: RU-SO-05
  execution_surface:
    ref: SO-SURF-05
    system: ServiceOps
    plane: control
    description: Creation, modification, or synchronization of CMDB records and relationships

  action_transition:
    from_state: cmdb-change-requested
    to_state: persistence
    trigger: CMDB write or reconciliation event

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-03
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: CI update requested → CMDB persisted → relationships propagated
    fallback_paths:
      - default reconciliation rules
    retry_paths:
      - reconciliation retry on sync failure
    failure_paths:
      - partial CI update
      - relationship graph inconsistency
      - external source overwrite

  guard_enforcement_points:
    pre_action: CMDB write admission gate
    mid_action: relationship propagation engine
    post_action: CMDB consistency checkpoint

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op

  notes: >
    CMDB persistence may silently affect downstream workflows and automation
