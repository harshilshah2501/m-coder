ReachabilityUnit:
  id: RU-AIOPS-05
  execution_surface:
    ref: AI-SURF-05
    system: AIOps
    plane: control
    description: Baseline or model state mutation affecting future inference

  action_transition:
    from_state: reasoning
    to_state: persistence
    trigger: baseline acceptance or model update

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: anomaly reviewed → baseline/model state updated
    fallback_paths:
      - auto-accept baseline under confidence threshold
    retry_paths:
      - retraining retry after partial failure
    failure_paths:
      - partial model update
      - stale baseline overwrite
      - model state corruption during update

  guard_enforcement_points:
    pre_action: baseline/model mutation gate
    mid_action: model update execution
    post_action: state commit finalization

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
