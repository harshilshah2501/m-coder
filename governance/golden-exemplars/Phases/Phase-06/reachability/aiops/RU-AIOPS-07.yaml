ReachabilityUnit:
  id: RU-AIOPS-07
  execution_surface:
    ref: AI-SURF-07
    system: AIOps
    plane: control
    description: Correlation-driven actions spanning multiple services, domains, or tenants

  action_transition:
    from_state: correlated-inference
    to_state: execution
    trigger: cross-domain correlation resolution

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-04
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: correlated anomaly detected → coordinated action executed
    fallback_paths:
      - partial correlation fallback
    retry_paths:
      - re-evaluation of correlation after failure
    failure_paths:
      - partial service visibility
      - cross-tenant propagation failure
      - inconsistent correlation state

  guard_enforcement_points:
    pre_action: correlation-to-action gate
    mid_action: coordinated execution orchestration
    post_action: cross-domain outcome aggregation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
