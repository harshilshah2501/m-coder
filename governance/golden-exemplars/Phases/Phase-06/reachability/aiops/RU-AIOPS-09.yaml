ReachabilityUnit:
  id: RU-AIOPS-09
  execution_surface:
    ref: AI-SURF-09
    system: AIOps
    plane: control
    description: Automated retry and self-healing mechanisms re-attempting failed actions

  action_transition:
    from_state: failed-execution
    to_state: execution
    trigger: retry policy

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: execution failure → retry triggered → action re-executed
    fallback_paths:
      - degraded-mode retry
    retry_paths:
      - exponential backoff retries
      - capped retry exhaustion
    failure_paths:
      - repeated partial success
      - retry storm
      - state divergence across retries

  guard_enforcement_points:
    pre_action: retry admission gate
    mid_action: in-flight retry execution
    post_action: retry outcome reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
