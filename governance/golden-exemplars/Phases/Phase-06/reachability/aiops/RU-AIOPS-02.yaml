ReachabilityUnit:
  id: RU-AIOPS-02
  execution_surface:
    ref: AI-SURF-02
    system: AIOps
    plane: control
    description: Policy evaluation engine binding conditions to automated actions

  action_transition:
    from_state: persisted-policy
    to_state: execution
    trigger: policy condition evaluation

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: policy condition met → bound action dispatched
    fallback_paths:
      - inherited or default policy resolution
    retry_paths:
      - repeated policy evaluation on periodic schedule
    failure_paths:
      - policy engine restart
      - stale policy cache
      - partial policy load

  guard_enforcement_points:
    pre_action: policy resolution to action binding
    mid_action: action dispatch from policy executor
    post_action: policy execution logging

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
