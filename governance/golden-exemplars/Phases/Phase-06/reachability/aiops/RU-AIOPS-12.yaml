ReachabilityUnit:
  id: RU-AIOPS-12
  execution_surface:
    ref: AI-SURF-12
    system: AIOps
    plane: control
    description: Execution paths triggered during system startup, recovery, or rehydration

  action_transition:
    from_state: restored-state
    to_state: execution
    trigger: system restart, recovery, or bootstrap sequence

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: system restart → queued or persisted action executed
    fallback_paths:
      - partial restore
    retry_paths:
      - replay of incomplete actions
    failure_paths:
      - corrupted persisted intent
      - duplicate execution on restart
      - missing historical context

  guard_enforcement_points:
    pre_action: recovery admission gate
    mid_action: bootstrap execution flow
    post_action: recovery completion checkpoint

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
