ReachabilityUnit:
  id: RU-AIOPS-06
  execution_surface:
    ref: AI-SURF-06
    system: AIOps
    plane: hybrid
    description: Automated actions tied to incident creation, update, or closure events

  action_transition:
    from_state: event-derived
    to_state: execution
    trigger: incident lifecycle transition

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-07
    - CODE-08

  control_paths:
    primary_path: incident state change → automated action executed
    fallback_paths:
      - inferred incident correlation triggers
    retry_paths:
      - retry on failed incident hook execution
    failure_paths:
      - incident state replay
      - partial incident update
      - automation hook timeout

  guard_enforcement_points:
    pre_action: incident hook evaluation gate
    mid_action: lifecycle-driven execution
    post_action: incident state reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
