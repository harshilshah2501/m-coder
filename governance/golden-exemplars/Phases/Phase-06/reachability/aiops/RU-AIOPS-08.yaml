ReachabilityUnit:
  id: RU-AIOPS-08
  execution_surface:
    ref: AI-SURF-08
    system: AIOps
    plane: control
    description: Deferred, scheduled, or delayed execution of previously stored intent

  action_transition:
    from_state: persisted-intent
    to_state: execution
    trigger: schedule, cooldown expiry, or deferred trigger

  required_guards:
    - CODE-01
    - CODE-02
    - CODE-05
    - CODE-06
    - CODE-08

  control_paths:
    primary_path: intent stored → scheduled trigger → execution
    fallback_paths:
      - manual reschedule or override
    retry_paths:
      - deferred execution retry after failure
    failure_paths:
      - scheduler restart
      - delayed trigger replay
      - stale intent execution

  guard_enforcement_points:
    pre_action: deferred execution gate
    mid_action: scheduled start
    post_action: execution reconciliation

  safe_terminal_states:
    - refusal
    - audit-only
    - no-op
