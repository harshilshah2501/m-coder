services:
  neo4j:
    image: neo4j:5
    container_name: motadata-graph-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${GRAPH_NEO4J_USER:-neo4j}/${GRAPH_NEO4J_PASSWORD:-NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: ${GRAPH_NEO4J_HEAP_INITIAL:-512M}
      NEO4J_server_memory_heap_max__size: ${GRAPH_NEO4J_HEAP_MAX:-1G}
    volumes:
      - neo4j_graph_data:/data
      - neo4j_graph_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          cypher-shell -a bolt://localhost:7687 -u ${GRAPH_NEO4J_USER:-neo4j} -p ${GRAPH_NEO4J_PASSWORD:-NEO4J_PASSWORD} "RETURN 1;" >/dev/null 2>&1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  graph-refresh:
    build:
      context: ../..
      dockerfile: docker/neo4j-graph/Dockerfile
    container_name: motadata-graph-refresh
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      PYTHONPATH: /workspace
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${GRAPH_NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${GRAPH_NEO4J_PASSWORD:-NEO4J_PASSWORD}
      MOTADATA_JAVA_ROOT: /motadata/motadata/src/main/java
      GRAPH_REFRESH_INTERVAL_SEC: ${GRAPH_REFRESH_INTERVAL_SEC:-900}
      GRAPH_REFRESH_FORCE_RESET: ${GRAPH_REFRESH_FORCE_RESET:-1}
      GRAPH_STATE_FILE: /state/java_graph_state.env
    volumes:
      - ../..:/workspace:ro
      - ${GRAPH_MOTADATA_ROOT:-/root/Harshil-PoCs/Motadata}:/motadata:ro
      - graph_refresh_state:/state
    command: ["bash", "/workspace/docker/neo4j-graph/refresh_loop.sh"]
    healthcheck:
      test: ["CMD", "bash", "/workspace/docker/neo4j-graph/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

volumes:
  neo4j_graph_data:
  neo4j_graph_logs:
  graph_refresh_state: