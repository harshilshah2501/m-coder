# Use JDK 17 for Gradle daemon and build.
# If runIde fails with "GradleJvmSupportMatrix" / "IllegalArgumentException: 25",
# ensure JAVA_HOME points to JDK 17 when running: export JAVA_HOME=/path/to/jdk17
org.gradle.jvmargs=-Xmx512m -Dfile.encoding=UTF-8 -Didea.kotlin.plugin.use.k2=true
# Avoid broken kotlin.plugin.k1.xml xi:include when resolving bundled Kotlin plugin (IDEA 2025.3 SDK).
systemProp.idea.kotlin.plugin.use.k2=true
