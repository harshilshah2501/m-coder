# Product Authority Registry v1.1
# Phase 1 Foundation — Sample concepts for validation testing
#
# Paths are relative to the Java module tree. Lint resolves:
#   workspace_root/motadata/<path>  and  workspace_root/<path>
# Re-confirmed against a sample Motadata checkout:
#   <workspace_root>/motadata/src/main/java/com/mindarray/
# Registry now covers aiops core plus selected high-value operational subsystems
# (api, notification, discovery, eventbus, integration) as an incremental contract set.
# Update file entries when the product tree changes; entries must exist on disk for
# lint to pass (no runtime generation — this is static YAML, not model output).

