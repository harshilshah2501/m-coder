# Product Authority Registry v1.1
# Phase 1 Foundation — Sample concepts for validation testing
#
# Paths are relative to the Java module tree. Lint resolves:
#   workspace_root/motadata/<path>  and  workspace_root/<path>
# Update file entries when the product tree changes; entries must exist on disk for
# lint to pass (no runtime generation — this is static YAML, not model output).

schema_version: "product_authority_registry.v1.1"
last_updated: "2026-04-15"
maintainer: "harshil@motadata.com"

concepts:

  incident_deduplication:
    primary_owner:
      file: "src/main/java/com/mindarray/aiops/DependencyQueryProcessor.java"
      class: "DependencyQueryProcessor"
      method: "process"
      confidence: "high"

    verification:
      last_verified_at: "2026-04-15T00:00:00Z"
      verification_source: "human"
      verification_notes: "Aligned with current com.mindarray.aiops package layout"
      staleness_threshold_days: 90

    aliases:
      - "duplicate incident"
      - "incident dedup"
      - "dedup"
      - "duplicate detection"
      - "incident matching"

    collaborators:
      - file: "src/main/java/com/mindarray/aiops/DependencyManager.java"
        role: "orchestrator"
        relationship: "dependency_context"
      - file: "src/main/java/com/mindarray/aiops/AIOpsConstants.java"
        role: "query_support"
        relationship: "constants"

    forbidden_distractors:
      - file: "src/main/java/com/mindarray/aiops/AvailabilityCorrelationEngine.java"
        reason: "Availability correlation domain, not incident deduplication"
      - file: "src/main/java/com/mindarray/aiops/package-info.java"
        reason: "Package metadata, not deduplication implementation"

    notes:
      - "Query and dependency resolution share the aiops module"
      - "Uses DependencyManager for dependency context"

    entry_points:
      - type: "service"
        file: "src/main/java/com/mindarray/aiops/DependencyQueryProcessor.java"
        method: "process"
        event_type: ""

    control_flow:
      entry: "DependencyQueryProcessor"
      path:
        - "DependencyQueryProcessor.process()"
        - "DependencyManager.resolve()"
      exit: "Downstream store"

  alert_correlation:
    primary_owner:
      file: "src/main/java/com/mindarray/aiops/AvailabilityCorrelationEngine.java"
      class: "AvailabilityCorrelationEngine"
      confidence: "high"

    verification:
      last_verified_at: "2026-04-15T00:00:00Z"
      verification_source: "human"
      staleness_threshold_days: 90

    aliases:
      - "alert grouping"
      - "alert clustering"
      - "related alerts"
      - "correlation engine"

    collaborators:
      - file: "src/main/java/com/mindarray/aiops/DependencyManager.java"
        role: "manager"
        relationship: "lifecycle_management"
      - file: "src/main/java/com/mindarray/aiops/DependencyQueryProcessor.java"
        role: "query_support"
        relationship: "context_enrichment"

    forbidden_distractors:
      - file: "src/main/java/com/mindarray/aiops/AIOpsConstants.java"
        reason: "Constants only, not correlation engine behavior"

    notes:
      - "Availability-oriented correlation in current tree"
      - "Shares aiops module with dependency and query helpers"

    entry_points:
      - type: "service"
        file: "src/main/java/com/mindarray/aiops/AvailabilityCorrelationEngine.java"
        method: "correlate"
        event_type: ""

  alert_escalation:
    primary_owner:
      file: "src/main/java/com/mindarray/aiops/DependencyManager.java"
      class: "DependencyManager"
      confidence: "medium"

    verification:
      last_verified_at: "2020-01-01T10:00:00Z"
      verification_source: "human"
      verification_notes: "Escalation-adjacent dependency handling in aiops module"
      staleness_threshold_days: 90

    aliases:
      - "escalation"
      - "alert escalation"
      - "severity escalation"
      - "escalate alert"

    collaborators:
      - file: "src/main/java/com/mindarray/aiops/AIOpsConstants.java"
        role: "notification"
        relationship: "policy_constants"

    forbidden_distractors: []

    notes:
      - "Placeholder mapping where dedicated alerting classes are absent"
