# Motadata AI System - Main Configuration
# This file contains the primary configuration for all services

system:
  name: Motadata AI System
  version: v15
  root_dir: /home/harshil/Harshil-PoCs
  log_level: INFO

paths:
  venv:
    training: /home/harshil/Harshil-PoCs/venv/training
    vllm: /home/harshil/Harshil-PoCs/venv/vllm
    rag: /home/harshil/Harshil-PoCs/venv/rag
  
  models:
    root: /home/harshil/Harshil-PoCs/models
    current: /home/harshil/Harshil-PoCs/models/v15/motadata-coder-v15-merged
  
  services:
    rag: /home/harshil/Harshil-PoCs/rag
    training: /home/harshil/Harshil-PoCs/training
    evaluation: /home/harshil/Harshil-PoCs/evaluation
  
  data:
    logs: /home/harshil/Harshil-PoCs/logs
    datasets: /home/harshil/Harshil-PoCs/training/data
    checkpoints: /home/harshil/Harshil-PoCs/training/checkpoints

services:
  vllm:
    port: 8000
    model_name: motadata-coder
    dtype: bfloat16
    max_model_len: 16384
    gpu_memory_utilization: 0.95
    trust_remote_code: true
    disable_log_requests: true
  
  api_wrapper:
    port: 8080
    timeout: 30
  
  rag_api:
    port: 8081
    timeout: 60
    embedding_model: jina-embeddings-v2-base-code
    embedding_dim: 768
  
  qdrant:
    port: 6333
    host: localhost
    collection_name: motadata_code

docker:
  compose_file: /home/harshil/Harshil-PoCs/rag/docker/docker-compose.yml
  images:
    qdrant: qdrant/qdrant:latest

timeouts:
  docker: 60
  vllm: 180
  api_wrapper: 30
  rag: 60

