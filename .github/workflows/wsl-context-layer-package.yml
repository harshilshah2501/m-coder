name: wsl-context-layer-package

on:
  workflow_dispatch:
    inputs:
      sanity_query:
        description: "Sanity query for /v1/export_evidence"
        required: false
        default: "How does alert correlation work in this repo?"
      top_k:
        description: "top_k for evidence export sanity check"
        required: false
        default: "8"
      l58_suite:
        description: "L5.8 harness suite (smoke|full)"
        required: false
        default: "full"
  push:
    branches:
      - main
      - integration/**
      - feature/**
    paths:
      - "packaging/motadata-context-layer/**"
      - "runtime/context_layer_service/**"
      - "runtime/layer5/**"
      - ".github/workflows/wsl-context-layer-package.yml"
  pull_request:
    paths:
      - "packaging/motadata-context-layer/**"
      - "runtime/context_layer_service/**"
      - "runtime/layer5/**"
      - ".github/workflows/wsl-context-layer-package.yml"
  schedule:
    - cron: "0 3 * * *"

jobs:
  build-verify-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Make pipeline executable
        run: chmod +x packaging/motadata-context-layer/build_and_verify_wsl_context_layer.sh

      - name: Build and verify WSL Context Layer package
        env:
          WORKSPACE_ROOT: ${{ github.workspace }}
          SANITY_QUERY: ${{ github.event.inputs.sanity_query || 'How does alert correlation work in this repo?' }}
          TOP_K: ${{ github.event.inputs.top_k || '8' }}
        run: |
          bash packaging/motadata-context-layer/build_and_verify_wsl_context_layer.sh

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: motadata-context-layer-wheel
          path: packaging/motadata-context-layer/dist/*.whl
          if-no-files-found: error

      - name: Install pytest
        run: python -m pip install pytest

      - name: Run L5.8 smoke harness (PR + feature/integration)
        if: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}
        env:
          L58_REQUIRE_PASS: "1"
        run: pytest runtime/layer5/tests/test_l58_grounded_harness.py::test_l58_harness_smoke -v

      - name: Run L5.8 full harness (main + nightly)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
        env:
          L58_REQUIRE_PASS: "1"
        run: pytest runtime/layer5/tests/test_l58_grounded_harness.py::test_l58_harness_full -v

      - name: Run L5.8 harness from workflow dispatch
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          L58_REQUIRE_PASS: "1"
        run: |
          if [ "${{ github.event.inputs.l58_suite || 'full' }}" = "smoke" ]; then
            pytest runtime/layer5/tests/test_l58_grounded_harness.py::test_l58_harness_smoke -v
          else
            pytest runtime/layer5/tests/test_l58_grounded_harness.py::test_l58_harness_full -v
          fi
